<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalogue — Nano Kids Wholesale</title>
<meta name="description" content="Browse the Nano Kids wholesale catalogue. Filter by age, category, fabric and MOQ.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="catalog">
<main id="main">

  <section class="page-banner page-banner--sand">
    <div class="wrap">
      <div class="page-banner-panel">
        <div class="page-banner-copy">
          <div class="crumbs"><span><a href="index.html">Home</a></span><span>Catalogue</span><span id="crumbCur">All styles</span></div>
          <h1 id="shopTitle">Trade <em>catalogue.</em></h1>
          <p>Wholesale prices per piece, with each style’s own MOQ, pack ratio and lead time.</p>
        </div>
        <div class="page-banner-media">
          <div class="hero-blob" aria-hidden="true"></div>
          <div class="hero-photo">
            <img src="https://images.pexels.com/photos/6725093/pexels-photo-6725093.jpeg?auto=compress&amp;cs=tinysrgb&amp;w=2000" alt="Two children in matching camel cord jumpsuits, grey studio">
          </div>
        </div>
      </div>
    </div>
  </section>
  <div class="wrap shop-layout">
    <aside class="filters" id="filters" aria-label="Filters"></aside>
    <div class="filter-footer"><button class="btn btn--ghost" id="filterReset" style="flex:1">Clear</button><button class="btn" id="filterApply" style="flex:2">Show styles</button></div>
    <section class="shop-main" aria-label="Styles">
      <div class="toolbar">
        <div class="toolbar-left">
          <button class="btn btn--ghost btn--sm filter-open" id="filterOpen">Filters</button>
          <span class="result-count" id="resultCount"></span>
        </div>
        <div class="toolbar-right">
          <label class="sr-only" for="sortSel">Sort by</label>
          <select class="sort-select" id="sortSel">
            <option value="featured">Featured</option>
            <option value="moq">MOQ: low to high</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
            <option value="name">Name</option>
          </select>
        </div>
      </div>
      <div class="products" id="productGrid"></div>
    </section>
  </div>

</main>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/catalog.js"></script>
</body>
</html>
