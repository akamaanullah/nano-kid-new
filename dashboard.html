<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — Nano Kids Wholesale</title>
<meta name="description" content="Your trade account: orders, quotes, invoices and your account manager.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="dashboard">
<main id="main">

  <section class="section section--tight">
    <div class="wrap dash">
      <aside class="dash-side">
        <p class="eyebrow">Trade account</p>
        <h2 id="dashName">Your account</h2>
        <p class="muted" id="dashEmail"></p>
        <nav class="dash-nav">
          <button type="button" class="is-on" data-tab="orders">Orders</button>
          <button type="button" data-tab="quotes">Quotes</button>
          <button type="button" data-tab="invoices">Invoices</button>
          <button type="button" data-tab="manager">Account manager</button>
        </nav>
        <button class="btn btn--pill btn--ghost btn--sm" type="button" id="logoutBtn">Sign out</button>
      </aside>
      <div class="dash-main">
        <div data-panel="orders">
          <div class="section-head"><h3>Recent orders</h3><a class="link" href="catalog.html">Place a reorder from the catalogue</a></div>
          <div class="table-wrap"><table class="quote-table" id="orderTable"><thead><tr><th>Order</th><th>Date</th><th>Status</th><th>Pieces</th><th>Total</th><th></th></tr></thead><tbody></tbody></table></div>
        </div>
        <div data-panel="quotes" hidden>
          <h3>Quote status</h3>
          <div class="table-wrap"><table class="quote-table" id="quoteTable"><thead><tr><th>Reference</th><th>Date</th><th>Status</th><th>Pieces</th><th>Estimate</th></tr></thead><tbody></tbody></table></div>
        </div>
        <div data-panel="invoices" hidden>
          <h3>Invoices</h3>
          <div class="table-wrap"><table class="quote-table" id="invoiceTable"><thead><tr><th>Invoice</th><th>Date</th><th>Amount</th><th>Status</th></tr></thead><tbody></tbody></table></div>
        </div>
        <div data-panel="manager" hidden>
          <div class="manager-card">
            <span class="hero-pill">Your desk</span>
            <h3 id="mgrName"></h3>
            <p class="muted" id="mgrRole"></p>
            <p id="mgrPhone"></p>
            <p id="mgrEmail"></p>
            <p class="muted" id="mgrHours"></p>
            <a class="btn btn--pill" href="contact.html">Message the trade desk</a>
          </div>
        </div>
      </div>
    </div>
  </section>

</main>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
