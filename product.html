<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Style — Nano Kids Wholesale</title>
<meta name="description" content="Wholesale style details, tier pricing, size assortment and MOQ.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="product">
<main id="main">

  <div class="wrap">
    <div class="crumbs" id="crumbs" style="padding-top:24px"></div>
  </div>
  <div class="wrap pdp pdp-wholesale">
    <div class="pdp-gallery">
      <div class="thumbs" id="thumbs"></div>
      <div class="pdp-main"><img id="mainImg" alt=""></div>
    </div>
    <div class="pdp-info">
      <p class="eyebrow" id="pAge"></p>
      <h1 id="pName"></h1>
      <p class="p-sku" id="pSku"></p>
      <ul class="spec-row">
        <li><span>MOQ</span><b id="pMoq"></b></li>
        <li><span>Lead time</span><b id="pLead"></b></li>
        <li><span>Availability</span><b id="pStock"></b></li>
        <li><span>Fabric / GSM</span><b><span id="pFabric"></span> · <span id="pGsm"></span></b></li>
        <li><span>Pack</span><b id="pPack"></b></li>
      </ul>
      <p class="lead" id="pDesc"></p>

      <h3 class="subhead">Volume tiers</h3>
      <table class="tier-table" id="tierTable"><thead><tr><th>Quantity</th><th>Discount</th><th>Unit price</th></tr></thead><tbody></tbody></table>

      <div class="opt-block">
        <div class="opt-lab">Colour <b id="colorName"></b></div>
        <div class="swatch-row" id="colorRow"></div>
      </div>
      <div class="opt-block">
        <div class="opt-lab">Assortment — quantities per size</div>
        <div class="size-grid" id="sizeGrid"></div>
      </div>

      <div class="live-bar">
        <div><span class="muted">Total pieces</span><b id="liveQty">0</b></div>
        <div><span class="muted">Unit price</span><b id="liveUnit">—</b></div>
        <div><span class="muted">Tier</span><b id="liveTier">Select quantities</b></div>
        <div><span class="muted">Line total</span><b id="liveTotal">Rs. 0</b></div>
      </div>
      <p class="moq-warn" id="moqWarn" hidden></p>
      <button class="btn btn--pill btn--block" type="button" id="addQuoteBtn">Add to quote</button>
    </div>
  </div>
  <section class="section">
    <div class="wrap">
      <div class="section-head"><h2>Related <em>styles</em></h2></div>
      <div class="products" id="relatedGrid"></div>
    </div>
  </section>

</main>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/product.js"></script>
</body>
</html>
